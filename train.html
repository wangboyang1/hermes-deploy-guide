<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Training Simulator — Learn by Doing</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --orange: #d2991d; --red: #f85149;
    --purple: #a371f7; --term-bg: #0a0e14; --term-text: #c9d1d9;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── Nav ── */
  nav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1.5rem; display: flex; align-items: center; gap: 0;
    flex-shrink: 0; z-index: 10;
  }
  nav .logo {
    font-weight: 700; font-size: 1.1rem; color: #fff;
    text-decoration: none; padding: 1rem 0; margin-right: auto;
    display: flex; align-items: center; gap: 0.4rem;
  }
  nav a.nav-link {
    color: var(--muted); text-decoration: none; padding: 1rem 1rem;
    font-size: 0.9rem; border-bottom: 2px solid transparent; transition: all 0.15s;
  }
  nav a.nav-link:hover, nav a.nav-link.active { color: var(--text); border-bottom-color: var(--accent); }

  /* ── Layout ── */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .sidebar h3 {
    padding: 1.2rem 1rem 0.6rem; font-size: 0.8rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .topic {
    padding: 0.7rem 1rem; cursor: pointer; display: flex; align-items: center;
    gap: 0.6rem; font-size: 0.88rem; border-left: 3px solid transparent;
    transition: all 0.15s; color: var(--text);
  }
  .topic:hover { background: rgba(88,166,255,0.04); }
  .topic.active { background: rgba(88,166,255,0.08); border-left-color: var(--accent); color: #fff; }
  .topic .check {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; border: 2px solid var(--border);
  }
  .topic.done .check { background: var(--green); border-color: var(--green); color: #fff; }
  .topic.done .check::after { content: '✓'; }
  .topic .label { flex: 1; }
  .topic .badge {
    font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 8px;
    background: rgba(88,166,255,0.15); color: var(--accent);
  }
  .progress-bar-wrap {
    padding: 0.8rem 1rem; border-top: 1px solid var(--border);
    font-size: 0.8rem; color: var(--muted);
  }
  .progress-bar-outer {
    height: 4px; background: var(--border); border-radius: 2px;
    margin-top: 0.4rem; overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%; background: var(--green); border-radius: 2px; transition: width 0.3s;
  }

  /* ── Main Area ── */
  .main-area {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── Task Panel ── */
  .task-panel {
    padding: 1.5rem 2rem; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .task-panel .topic-title {
    font-size: 1.3rem; color: #fff; font-weight: 700; margin-bottom: 0.2rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .task-panel .step-indicator {
    font-size: 0.78rem; color: var(--muted); margin-bottom: 0.8rem;
  }
  .task-panel .instruction {
    font-size: 0.95rem; color: var(--text); line-height: 1.6;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.2rem;
  }
  .task-panel .instruction strong { color: var(--accent); }
  .task-panel .hint-box {
    margin-top: 0.6rem; font-size: 0.82rem; color: var(--orange);
    display: none;
  }
  .task-panel .hint-box.visible { display: block; }
  .task-panel .btn-row {
    display: flex; gap: 0.6rem; margin-top: 0.8rem;
  }
  .btn {
    padding: 0.4rem 1rem; font-size: 0.82rem; font-weight: 600;
    border: none; border-radius: var(--radius); cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .btn-hint { background: rgba(210,153,29,0.12); color: var(--orange); border: 1px solid rgba(210,153,29,0.3); }
  .btn-hint:hover { background: rgba(210,153,29,0.2); }
  .btn-next { background: var(--accent); color: #fff; }
  .btn-next:hover { background: #4090e0; }
  .btn-prev { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-prev:hover { border-color: var(--muted); }
  .btn-reset { background: rgba(248,81,73,0.12); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }
  .btn-reset:hover { background: rgba(248,81,73,0.2); }

  /* ── Terminal ── */
  .terminal-wrap {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    margin: 0 2rem 1.5rem; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--term-bg);
  }
  .terminal-bar {
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .terminal-bar .dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .dot.red { background: #f85149; }
  .dot.yellow { background: #d2991d; }
  .dot.green { background: #3fb950; }
  .terminal-bar .title {
    margin-left: 0.5rem; font-size: 0.75rem; color: var(--muted);
  }
  .terminal-output {
    flex: 1; overflow-y: auto; padding: 1rem;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.88rem; line-height: 1.6; white-space: pre-wrap;
    word-break: break-all;
  }
  .terminal-output .line { margin-bottom: 0.1rem; }
  .terminal-output .prompt { color: var(--green); }
  .terminal-output .cmd-echo { color: var(--text); }
  .terminal-output .out-success { color: var(--green); }
  .terminal-output .out-info { color: var(--accent); }
  .terminal-output .out-warn { color: var(--orange); }
  .terminal-output .out-error { color: var(--red); }
  .terminal-output .out-system { color: var(--muted); font-style: italic; }

  .terminal-input-row {
    display: flex; align-items: center; padding: 0.5rem 1rem;
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .terminal-input-row .prompt-symbol {
    color: var(--green); font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.88rem; margin-right: 0.4rem; flex-shrink: 0;
  }
  .terminal-input-row input {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.88rem; outline: none; caret-color: var(--accent);
  }
  .terminal-input-row input::placeholder { color: var(--muted); }

  /* ── Completion ── */
  .completion-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; align-items: center; justify-content: center;
  }
  .completion-overlay.visible { display: flex; }
  .completion-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 2.5rem; text-align: center;
    max-width: 440px;
  }
  .completion-card .icon { font-size: 3.5rem; margin-bottom: 1rem; }
  .completion-card h2 { color: #fff; font-size: 1.5rem; margin-bottom: 0.5rem; }
  .completion-card p { color: var(--muted); margin-bottom: 1.5rem; }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    .sidebar { width: 100%; max-height: 200px; border-right: none; border-bottom: 1px solid var(--border); }
    .layout { flex-direction: column; }
    .terminal-wrap { margin: 0 1rem 1rem; }
    .task-panel { padding: 1rem; }
    nav { flex-wrap: wrap; justify-content: center; }
    nav .logo { margin-right: 0; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">🚀 Hermes Deploy Guide</a>
  <a href="index.html" class="nav-link">Home</a>

  <a href="commands.html" class="nav-link">Commands</a>

  <a href="search.html" class="nav-link">Search</a>

  <select class="lang-select" onchange="goToLang(this.value)" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:0.3rem 0.4rem;font-size:0.8rem;font-family:inherit;cursor:pointer;width:48px">

<div class="layout">

  <!-- ── Sidebar ── -->
  <div class="sidebar">
    <h3 id="sidebarTitle">📚 Training Modules</h3>
    <div id="topicList"></div>
    <div class="progress-bar-wrap">
      <div style="display:flex;justify-content:space-between">
        <span id="progressLabel">Overall Progress</span>
        <span id="progressText">0 / 28</span>
      </div>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- ── Main ── -->
  <div class="main-area">
    <div class="task-panel" id="taskPanel">
      <div class="topic-title" id="topicTitle"></div>
      <div class="step-indicator" id="stepIndicator"></div>
      <div class="instruction" id="instruction"></div>
      <div class="hint-box" id="hintBox"></div>
      <div class="btn-row">
        <button class="btn btn-prev" id="btnPrev" onclick="prevStep()">← Previous</button>
        <button class="btn btn-hint" id="btnHint" onclick="showHint()">💡 Hint</button>
        <button class="btn btn-next" id="btnNext" onclick="nextStep()" style="display:none">Next →</button>
        <button class="btn btn-reset" id="btnReset" onclick="resetAll()">🔄 Reset All</button>
      </div>
    </div>

    <div class="terminal-wrap">
      <div class="terminal-bar">
        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
        <span class="title">hermes-terminal — training mode</span>
      </div>
      <div class="terminal-output" id="termOutput"></div>
      <div class="terminal-input-row">
        <span class="prompt-symbol" id="promptSymbol">$</span>
        <input type="text" id="termInput" placeholder="Type a command and press Enter…" autofocus
          onkeydown="if(event.key==='Enter')executeCommand()">
      </div>
    </div>
  </div>

</div>

<!-- Completion Overlay -->
<div class="completion-overlay" id="completionOverlay">
  <div class="completion-card">
    <div class="icon">🎉</div>
    <h2>Training Complete!</h2>

    <button class="btn btn-next" onclick="document.getElementById('completionOverlay').classList.remove('visible')">Continue Training →</button>
  </div>
</div>

// ── State ──
const TLT = {
  en:{hint:'💡 Hint',prev:'← Previous',next:'Next →',resetAll:'🔄 Reset All',done:'done',
    stepOf:'Step {n} of {t}',progress:'Overall Progress',trainingModules:'📚 Training Modules',
    pageTitle:'Hermes Training Simulator — Learn by Doing'},
  zh:{hint:'💡 提示',prev:'← 上一步',next:'下一步 →',resetAll:'🔄 全部重置',done:'完成',
    stepOf:'第 {n} 步 / 共 {t} 步',progress:'总体进度',trainingModules:'📚 训练模块',
    pageTitle:'Hermes 训练模拟器 — 边做边学'},
  ko:{hint:'💡 힌트',prev:'← 이전',next:'다음 →',resetAll:'🔄 모두 초기화',done:'완료',
    stepOf:'{n} / {t} 단계',progress:'전체 진행률',trainingModules:'📚 훈련 모듈',
    pageTitle:'Hermes 훈련 시뮬레이터 — 실습하며 배우기'},
  es:{hint:'💡 Pista',prev:'← Anterior',next:'Siguiente →',resetAll:'🔄 Reiniciar',done:'hecho',
    stepOf:'Paso {n} de {t}',progress:'Progreso General',trainingModules:'📚 Módulos',
    pageTitle:'Simulador de Hermes — Aprende Haciendo'},
};
function tt(key){var lang=localStorage.getItem('hermes_lang')||'en';return (TLT[lang]&&TLT[lang][key])||TLT.en[key]||key;}
function applyPageLanguage(lang){localStorage.setItem('hermes_lang',lang);var sel=document.querySelector('.lang-select');if(sel)sel.value=lang;renderAll();document.title=tt('pageTitle');}

let currentTopic = 0;
let currentStep = 0;
let completed = {};     // { 'topicId-stepIdx': true }
let hintRevealed = {};  // { 'topicId-stepIdx': true }

function loadState() {
  const saved = localStorage.getItem('hermes_train_state');
  if (saved) {
    const s = JSON.parse(saved);
    currentTopic = s.currentTopic || 0;
    currentStep = s.currentStep || 0;
    completed = s.completed || {};
    hintRevealed = s.hintRevealed || {};
  }
}

function saveState() {
  localStorage.setItem('hermes_train_state', JSON.stringify({
    currentTopic, currentStep, completed, hintRevealed
  }));
}

// ── Render ──
function renderAll() {
  renderSidebar();
  renderTask();
  saveState();
}

function renderSidebar() {
  const list = document.getElementById('topicList');
  const totalSteps = CURRICULUM.reduce((s, t) => s + t.steps.length, 0);
  const doneSteps = Object.keys(completed).length;

  document.getElementById('progressText').textContent = `${doneSteps} / ${totalSteps}`;
  document.getElementById('progressBar').style.width = totalSteps > 0 ? `${(doneSteps/totalSteps)*100}%` : '0%';
  document.getElementById('sidebarTitle').textContent = tt('trainingModules');
  document.getElementById('progressLabel').textContent = tt('progress');

  list.innerHTML = CURRICULUM.map((t, ti) => {
    const topicDone = t.steps.every((_, si) => completed[`${ti}-${si}`]);
    const isActive = ti === currentTopic;
    return `
      <div class="topic ${isActive ? 'active' : ''} ${topicDone ? 'done' : ''}"
           onclick="selectTopic(${ti})">
        <span class="check"></span>
        <span class="label">${t.icon} ${t.title}</span>
        ${topicDone ? '<span class="badge">'+tt('done')+'</span>' : ''}
      </div>
    `;
  }).join('');
}

function renderTask() {
  const topic = CURRICULUM[currentTopic];
  const step = topic.steps[currentStep];

  document.getElementById('topicTitle').innerHTML = `${topic.icon} ${topic.title}`;
  document.getElementById('stepIndicator').textContent =
    tt('stepOf').replace('{n}', currentStep+1).replace('{t}', topic.steps.length);
  document.getElementById('instruction').innerHTML = step.instruction;

  const hintBox = document.getElementById('hintBox');
  hintBox.classList.toggle('visible', !!hintRevealed[`${currentTopic}-${currentStep}`]);
  hintBox.innerHTML = hintRevealed[`${currentTopic}-${currentStep}`]
    ? `${tt('hint')}: ${step.hint}` : '';

  document.getElementById('btnNext').style.display =
    completed[`${currentTopic}-${currentStep}`] ? 'inline-block' : 'none';

  document.getElementById('btnPrev').style.display =
    (currentTopic === 0 && currentStep === 0) ? 'none' : 'inline-block';

  document.getElementById('termInput').value = '';
  document.getElementById('termInput').focus();
}

function showHint() {
  hintRevealed[`${currentTopic}-${currentStep}`] = true;
  renderTask();
}

function executeCommand() {
  const input = document.getElementById('termInput');
  const cmd = input.value.trim();
  if (!cmd) return;

  const topic = CURRICULUM[currentTopic];
  const step = topic.steps[currentStep];
  const answer = step.answer;
  const output = document.getElementById('termOutput');

  // Echo the command
  appendLine(output, `$ ${cmd}`, 'cmd-echo');

  // Normalize: case-insensitive, collapse whitespace
  const normalize = s => s.toLowerCase().replace(/\s+/g, ' ').trim();
  const userCmd = normalize(cmd);
  const expectedCmd = normalize(answer);

  // Check if correct (exact match or contains the key parts)
  const isCorrect = userCmd === expectedCmd ||
    (expectedCmd.includes(' ') && userCmd.includes(expectedCmd.split(' ').slice(0, 2).join(' ')));

  if (isCorrect) {
    if (!completed[`${currentTopic}-${currentStep}`]) {
      completed[`${currentTopic}-${currentStep}`] = true;
    }
    appendLine(output, step.success, 'out-success');
    appendLine(output, step.output, 'out-info');

    // Check if all steps in topic are done
    const topicDone = topic.steps.every((_, si) => completed[`${currentTopic}-${si}`]);

    // Check if all topics are done
    const allDone = CURRICULUM.every((t, ti) =>
      t.steps.every((_, si) => completed[`${ti}-${si}`])
    );

    if (allDone) {
      setTimeout(() => {
        document.getElementById('completionOverlay').classList.add('visible');
      }, 600);
    }
  } else {
    appendLine(output, `❌ Not quite. Expected something like:`, 'out-error');
    appendLine(output, `   ${answer}`, 'out-warn');
    // Auto-reveal hint
    hintRevealed[`${currentTopic}-${currentStep}`] = true;
  }

  input.value = '';
  renderAll();
}

function appendLine(container, text, cls) {
  const div = document.createElement('div');
  div.className = `line ${cls || ''}`;
  div.innerHTML = text.replace(/\n/g, '<br>');
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function selectTopic(ti) {
  currentTopic = ti;
  currentStep = 0;
  renderAll();
}

function nextStep() {
  const topic = CURRICULUM[currentTopic];
  if (currentStep < topic.steps.length - 1) {
    currentStep++;
  } else if (currentTopic < CURRICULUM.length - 1) {
    currentTopic++;
    currentStep = 0;
  }
  renderAll();
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
  } else if (currentTopic > 0) {
    currentTopic--;
    currentStep = CURRICULUM[currentTopic].steps.length - 1;
  }
  renderAll();
}

function resetAll() {
  if (confirm('Reset all training progress? This cannot be undone.')) {
    completed = {};
    hintRevealed = {};
    currentTopic = 0;
    currentStep = 0;
    document.getElementById('termOutput').innerHTML = '';
    document.getElementById('completionOverlay').classList.remove('visible');
    renderAll();
  }
}

// ── Init ──
loadState();
renderAll();

function goToLang(lang) {
  localStorage.setItem('hermes_lang', lang);
  var sel = document.querySelector('.lang-select');
  if (sel) sel.value = lang;
  if (typeof setLanguage === 'function') setLanguage(lang);
  if (typeof setUILanguage === 'function') setUILanguage(lang);
}
